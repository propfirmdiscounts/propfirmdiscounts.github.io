name: Sync Homepage

on:
  schedule:
    # Run once every hour at minute 47
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-homepage
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update Top Codes and Tables
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          export STAMP
          
          # Fetch live markdown mirror from propfirmdiscount.com
          curl -sf --retry 3 --retry-delay 15 -A "Mozilla/5.0" \
            "https://propfirmdiscount.com/md?t=$(date +%s)" \
            -o home.md || exit 0

          python3 - <<'PY'
          import os, re

          try:
              home = open('home.md', encoding='utf-8').read()
          except Exception:
              raise SystemExit(0)

          lines = home.splitlines()
          start = next((i for i, l in enumerate(lines) if 'Exclusive' in l and l.startswith('##')), None)
          if start is None:
              raise SystemExit(0)

          # Parse table rows
          rows = []
          for l in lines[start + 1:]:
              if l.startswith('|') and not l.startswith('|---'):
                  parts = [p.strip() for p in l.split('|')]
                  if len(parts) >= 6 and parts[1] and parts[1] != '#':
                      rows.append(parts)
              elif rows:
                  break

          if len(rows) < 3:
              raise SystemExit(0)

          # Extract top firms
          firms = []
          for parts in rows:
              firm = parts[2]
              code = parts[3]
              discount = parts[4]
              m = re.search(r'(\d+(?:\.\d+)?)\s*%', discount)
              if m:
                  firms.append((float(m.group(1)), code, firm))

          firms.sort(key=lambda x: x[0], reverse=True)
          top5 = firms[:5]
          if top5:
              from collections import OrderedDict
              groups = OrderedDict()
              for pct_val, code, firm in top5:
                  pct_str = f"{int(pct_val) if pct_val == int(pct_val) else pct_val}%"
                  groups.setdefault(pct_str, []).append((code, firm))

              group_strs = []
              for pct_str, cf_list in groups.items():
                  cf_items = [f"code {c} at {f}" if i == 0 else f"{c} at {f}" for i, (c, f) in enumerate(cf_list)]
                  if len(cf_items) == 1:
                      cf_text = cf_items[0]
                  elif len(cf_items) == 2:
                      cf_text = f"{cf_items[0]} and {cf_items[1]}"
                  else:
                      cf_text = ", ".join(cf_items[:-1]) + f", and {cf_items[-1]}"
                  group_strs.append(f"{pct_str} OFF with {cf_text}")

              if len(group_strs) == 1:
                  joined = group_strs[0]
              elif len(group_strs) == 2:
                  joined = f"{group_strs[0]} and {group_strs[1]}"
              else:
                  joined = ", ".join(group_strs[:-1]) + f", and {group_strs[-1]}"

              line = f"The highest verified prop firm discounts currently include {joined}. Explore the top 10 tracked discount codes, ranked by available discount percentage."

              md = open('README.md', encoding='utf-8').read()
              md = re.sub(r'(?<=<!-- pfd-top-code \(auto-updated each sync\) -->\n)[^\n]+',
                          lambda _: line, md, count=1)
              open('README.md', 'w', encoding='utf-8').write(md)

              try:
                  cfg = open('_config.yml', encoding='utf-8').read()
                  escaped_desc = line.replace('"', '\\"')
                  cfg = re.sub(r'(?<=description: ")[^"\n]+',
                               lambda _: escaped_desc, cfg, count=1)
                  open('_config.yml', 'w', encoding='utf-8').write(cfg)
              except Exception:
                  pass

          # Update the single top 10 table
          top10 = rows[:10]
          header = '| # | Prop Firm | Exclusive Code | Discount | Code Validity | Firm Page |\n|---|---|---|---|---|---|\n'
          body = []
          for r in top10:
              num = r[1]
              firm = r[2]
              code = r[3]
              disc = r[4]
              ends = 'No expiry'
              link = r[6]
              body.append(f'| {num} | {firm} | {code} | {disc} | {ends} | [{firm} Deals]({link}) |')
          table_block = '\n' + header + '\n'.join(body) + '\n\n'

          md = open('README.md', encoding='utf-8').read()
          md = re.sub(r'(?<=<!-- pfd-exclusive-table \(auto-updated each sync\) -->\n)'
                      r'.*?(?=\n<!-- /pfd-exclusive-table -->)',
                      lambda _: table_block, md, count=1, flags=re.S)
          open('README.md', 'w', encoding='utf-8').write(md)

          # Update lastmod in sitemap.xml
          if os.path.exists('sitemap.xml'):
              sitemap = open('sitemap.xml', encoding='utf-8').read()
              sitemap = re.sub(r'<lastmod>\d{4}-\d{2}-\d{2}</lastmod>', f'<lastmod>{os.environ["STAMP"]}</lastmod>', sitemap)
              open('sitemap.xml', 'w', encoding='utf-8').write(sitemap)
          PY

          rm -f home.md

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Sync $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -m "Hourly snapshot of top verified exclusive discount codes." \
            -m "Co-Authored-By: propfirmdiscounts <73492456+propfirmdiscounts@users.noreply.github.com>"
          git push

    <script type="application/ld+json">

        {
          "@type": "Question",
          "name": "What is PropFirmDiscounts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PropFirmDiscounts is a public data mirror of PropFirmDiscount.com, providing structured information about proprietary trading firm discount codes, promotional offers, and historical deal records."
          }
        },
        {
          "@type": "Question",
          "name": "How many prop firms are included in the dataset?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The dataset currently tracks 53 proprietary trading firms with individual discount code and deal records. The number of tracked firms may change as new firms are added or existing records are updated."
          }
        },
        {
          "@type": "Question",
          "name": "How often is the dataset updated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The GitHub and Hugging Face mirrors are synchronized hourly with the primary PropFirmDiscount database. Update history can be checked through the repository commit history."
          }
        },
        {
          "@type": "Question",
          "name": "Can AI agents access this dataset?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. AI agents can access the dataset through its JSON and Markdown endpoints or connect directly to the PropFirmDiscount MCP server for structured queries about firms, discount codes, deals, and seasonal promotions."

        },
